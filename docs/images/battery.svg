<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Battery protection for battery and solar cameras</title>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="36" font-size="15" font-weight="600" fill="#24292f">Battery protection — battery and solar cameras only (default levels)</text>

  <!-- Scale: 0% at x=60, 100% at x=820 (7.6 px per point) -->
  <g font-size="12" fill="#24292f">
    <rect x="60" y="70" width="304" height="56" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
    <rect x="364" y="70" width="152" height="56" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
    <rect x="516" y="70" width="304" height="56" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="212" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#82071e">Nothing captured</text>
    <text x="212" y="113" text-anchor="middle">battery read every 15 min</text>
    <text x="440" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#6b4600">On demand only</text>
    <text x="440" y="113" text-anchor="middle">widget, doorbell</text>
    <text x="668" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#116329">Everything runs</text>
    <text x="668" y="113" text-anchor="middle">periodic refresh, events</text>
  </g>

  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="60" y="144">0%</text>
    <text x="364" y="144">40%</text>
    <text x="516" y="144">60%</text>
    <text x="668" y="144">80%</text>
    <text x="820" y="144">100%</text>
  </g>
  <line x1="668" y1="126" x2="668" y2="132" stroke="#57606a"/>

  <!-- Hysteresis: discharge pauses at 60, recharge resumes only at 80 -->
  <path d="M800,182 L520,182" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="660" y="174" text-anchor="middle" font-size="12" fill="#82071e">discharging: the automatic refresh pauses at 60%</text>

  <path d="M520,232 L664,232" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <line x1="516" y1="182" x2="516" y2="232" stroke="#8c959f" stroke-dasharray="4 3"/>
  <line x1="668" y1="222" x2="668" y2="242" stroke="#1a7f37" stroke-width="2"/>
  <text x="592" y="254" text-anchor="middle" font-size="12" fill="#116329">recharging: still paused until 80%</text>

  <text x="30" y="290" font-size="12" fill="#24292f">A partial recharge would restart the drain, and repeated shallow cycles wear the battery faster.</text>
  <text x="30" y="310" font-size="12" fill="#57606a">Wired cameras are never throttled. All three levels and the battery cameras' intervals are configurable.</text>
</svg>

# -----------------------------------------------------------------------------
# Pull request title = the squash commit = the version bump and the changelog
# line users read. It must be a Conventional Commit, in English, describing the
# change for the user: "feat(widgets): add a power chart to the energy widget",
# not "wip". The rules live in .github/scripts/release.mjs (check-title) and
# are tested in test/release.test.js.
# -----------------------------------------------------------------------------
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    # Dependabot writes its own titles (build(deps): ...), never read by users.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/release.mjs check-title "$PR_TITLE"

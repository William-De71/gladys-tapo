# -----------------------------------------------------------------------------
# Build & publish the multi-architecture image (linux/amd64 + linux/arm64) on
# the GitHub Container Registry.
#
# Triggers:
#   - called by the Release workflow (workflow_call) -> `:X.Y.Z` + `:latest`;
#   - a `vX.Y.Z` tag pushed by hand                  -> `:X.Y.Z` + `:latest`;
#   - a manual run (workflow_dispatch)               -> test image tagged with
#     the branch name (or `image-tag`), `latest` untouched.
#
# OCI labels (source, licence, version) come from docker/metadata-action. The
# manifest also ships as the `io.gladysassistant.manifest` label: Gladys reads
# it back when the integration is installed from its image name.
# -----------------------------------------------------------------------------
name: Build and publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to publish (defaults to the branch name)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Released version, e.g. 1.2.0 (publishes :<version> + :latest)'
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release build: the tag just created (the default checkout would be
          # the commit before the version bump, with a stale manifest).
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
          persist-credentials: false

      - name: Resolve the version
        id: version
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Registry names are lowercase (the owner is not).
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # The `version` input only exists when release.yml calls us: inside a
          # called workflow GITHUB_EVENT_NAME is the caller's event.
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME//\//-}}"
            if [ "$tag" = "latest" ]; then
              echo "::error::Cannot use 'latest' as a manual image tag."
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.title=gladys-tapo
            org.opencontainers.image.description=TP-Link Tapo cameras, doorbells, plugs, bulbs and hub sensors in Gladys Assistant
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Manifest label
        id: manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          # A label value is one line: compact JSON, docker_image on this build.
          manifest="$(jq -c --arg image "$image" '.docker_image = $image' gladys-assistant-integration.json)"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.gladysassistant.manifest=${{ steps.manifest.outputs.manifest }}

      - name: Build summary
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
        run: |
          {
            echo "## Image"
            echo ""
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo ""
            echo "Test it in Gladys: **Integrations → Install an integration → Developer mode**, with this manifest:"
            echo ""
            echo '```json'
            jq --arg image "$IMAGE" '.docker_image = $image' gladys-assistant-integration.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
